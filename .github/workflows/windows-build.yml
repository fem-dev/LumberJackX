name: ساخت نسخه ویندوز

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'پس از ساخت، نسخه را در بخش Releases منتشر کن'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'برچسب نسخه برای انتشار دستی، مانند v0.3.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: ساخت و آزمون ویندوز x64
    runs-on: windows-2022

    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: کش بسته‌های NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src-managed/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: پیکربندی کتابخانه بومی C++
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'پیکربندی CMake ناموفق بود.' }

      - name: ساخت کتابخانه و تست‌های C++
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'ساخت کتابخانه بومی ناموفق بود.' }

      - name: اجرای تست‌های C++
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'تست‌های C++ ناموفق بودند.' }

      - name: بازیابی وابستگی‌های برنامه
        shell: pwsh
        run: |
          dotnet restore src-managed/LumberJackX.App/LumberJackX.App.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'بازیابی وابستگی‌های برنامه ناموفق بود.' }
          dotnet restore src-managed/LumberJackX.Tests/LumberJackX.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'بازیابی وابستگی‌های تست ناموفق بود.' }

      - name: ساخت برنامه و تست‌های مدیریت‌شده
        shell: pwsh
        run: |
          dotnet build src-managed/LumberJackX.App/LumberJackX.App.csproj --configuration Release --runtime win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'ساخت برنامه WinForms ناموفق بود.' }
          dotnet build src-managed/LumberJackX.Tests/LumberJackX.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'ساخت تست‌های مدیریت‌شده ناموفق بود.' }

      - name: اجرای تست‌های مدیریت‌شده
        shell: pwsh
        run: |
          dotnet run --project src-managed/LumberJackX.Tests/LumberJackX.Tests.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'تست‌های مدیریت‌شده ناموفق بودند.' }

      - name: انتشار نسخه سبک ویندوز
        shell: pwsh
        run: |
          dotnet publish src-managed/LumberJackX.App/LumberJackX.App.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'انتشار برنامه ناموفق بود.' }

          $publishDir = Join-Path $PWD 'src-managed/LumberJackX.App/bin/Release/net10.0-windows/win-x64/publish'
          $nativeDll = Get-ChildItem -Path (Join-Path $PWD 'build') -Filter 'LumberJackVision.dll' -Recurse | Select-Object -First 1
          if (-not $nativeDll) { throw 'LumberJackVision.dll ساخته نشد.' }
          Copy-Item $nativeDll.FullName -Destination $publishDir -Force

          if (-not (Test-Path (Join-Path $publishDir 'LumberJackX.exe'))) {
            throw 'فایل اجرایی LumberJackX.exe در خروجی انتشار پیدا نشد.'
          }

          $package = Join-Path $PWD 'package'
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Join-Path $publishDir '*') -Destination $package -Recurse -Force
          Copy-Item README.md (Join-Path $package 'README.md')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'LumberJackX-windows-x64.zip' -Force

      - name: بارگذاری خروجی ساخت
        uses: actions/upload-artifact@v4
        with:
          name: LumberJackX-windows-x64
          path: LumberJackX-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: بررسی برچسب انتشار دستی
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'برای انتشار دستی باید release_tag را مانند v0.3.0 وارد کنید.'
          }

      - name: انتشار در GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: LumberJackX ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: LumberJackX-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
