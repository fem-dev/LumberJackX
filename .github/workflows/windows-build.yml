name: ساخت نسخه ویندوز

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'پس از ساخت، نسخه را در بخش Releases منتشر کن'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'برچسب نسخه برای انتشار دستی، مانند v0.2.1'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: ساخت برنامه ویندوز x64
    runs-on: windows-2022
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب OpenCV با vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) { throw "vcpkg پیدا نشد: $vcpkg" }
          & $vcpkg install 'opencv4:x64-windows' --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'نصب OpenCV ناموفق بود.' }

      - name: پیکربندی CMake
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'پیکربندی CMake ناموفق بود.' }

      - name: کامپایل نسخه Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'کامپایل برنامه ناموفق بود.' }

      - name: اجرای تست‌ها
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'یک یا چند تست ناموفق بود.' }

      - name: آماده‌سازی بسته قابل اجرا
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          cmake --install build --config Release --prefix $package
          if ($LASTEXITCODE -ne 0) { throw 'مرحله نصب CMake ناموفق بود.' }
          $dllDir = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'
          Get-ChildItem $dllDir -Filter '*.dll' | Copy-Item -Destination $package -Force
          Copy-Item README.md (Join-Path $package 'راهنمای-فارسی.md')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath 'LumberJackX-windows-x64.zip' -Force

      - name: بارگذاری خروجی ساخت
        uses: actions/upload-artifact@v4
        with:
          name: LumberJackX-windows-x64
          path: |
            package/
            LumberJackX-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: بررسی برچسب انتشار دستی
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'برای انتشار دستی باید release_tag را مانند v0.2.1 وارد کنید.'
          }

      - name: انتشار در GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          name: LumberJackX ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            package/LumberJackX.exe
            LumberJackX-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
